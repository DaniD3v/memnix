[package]
name = "memnix"
version = "0.1.1"
edition = "2024"

description = "from scratch nix language evaluator that does incremental evaluation"
repository = "https://github.com/DaniD3v/memnix"
license = "MIT"

[dependencies]
rnix = "0.14.0"
rowan = "0.16.1"

ordered-float = { version = "5.3.0", features = ["serde"] }
generativity = "1.2.1"

petgraph = "0.8.3"
cached = { version = "2.0.2", features = ["disk_store"] }
blake3 = { version = "1.8.5", features = ["serde"] }

serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }

clap = { version = "4.6.1", features = ["derive"] }

derive_builder = "0.20.2"
thiserror = "2.0.18"
getset = "0.1.6"
strum = { version = "0.28.0", features = ["derive"] }
